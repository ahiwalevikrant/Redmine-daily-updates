name: Daily Redmine Report

on:
  repository_dispatch:
    types: [run-daily-report]  # triggered externally by cron-job.org at 8:30 AM IST, Mon-Fri
  workflow_dispatch:  # allows manual trigger from the Actions tab, for testing

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Redmine report
        env:
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python redmine_daily_report.py
