name: Daily Redmine Report

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Debug times
        # Prints the event payload and both UTC and IST timestamps so we can
        # determine whether the scheduler created the run at the expected time
        # or the job was queued and started later.
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "UTC job start: $(date -u +"%Y-%m-%d %H:%M:%S %Z")"
          echo "IST job start: $(TZ='Asia/Kolkata' date +"%Y-%m-%d %H:%M:%S %Z")"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "Event payload (first 200 lines):"
          head -n 200 "$GITHUB_EVENT_PATH" || true
          echo "----- end payload -----"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.REDMINE_URL }}" ]; then
            echo "REDMINE_URL secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.REDMINE_API_KEY }}" ]; then
            echo "REDMINE_API_KEY secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "TEAMS_WEBHOOK_URL secret is missing"
            exit 1
          fi

      - name: Run Redmine Report
        env:
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python redmine_daily_report.py
